[project]
name = "encore-sendspin-ma-lab"
version = "0.1.0"
requires-python = "==3.14.7"
# Real MA core + Sendspin runtime. ML analysis and WebRTC are deliberately not
# installed: neither is used by this isolated PCM Sendspin lab.
dependencies = [
  "aiodns>=4.0.4",
  "aiohttp_asyncmdnsresolver==0.2.0",
  "Brotli>=1.0.9",
  "aiohttp==3.14.4",
  "aiohttp-fast-zlib==0.3.0",
  "aiohttp-socks==0.12.0",
  "aiofiles==24.1.0",
  "aiosqlite==0.22.1",
  "awesomeversion>=24.6.0",
  "certifi==2026.10.19",
  "colorlog==6.12.0",
  "modern_colorthief==0.3.0",
  "cryptography==50.0.0",
  "chardet==7.6.0",
  "ifaddr==0.2.0",
  "getmac==0.9.6",
  "hass-client==1.4.1",
  "mashumaro==3.22",
  "music-assistant-models==1.1.242",
  "music-assistant-frontend @ https://github.com/music-assistant/frontend/releases/download/2.17.372/music_assistant_frontend-2.17.372-py3-none-any.whl#sha256=08fe4d48025810bc94b3761ee381d2cbec89d21215d870723c6c3714a340d99b",
  "mutagen==1.48.1",
  "orjson==3.11.6",
  "pillow==13.0.0",
  "podcastparser==0.6.11",
  "propcache>=0.2.1",
  "python-slugify==9.1.1",
  "xmltodict==1.0.4",
  "defusedxml==0.7.1",
  "markdownify==1.2.3",
  "shortuuid==1.0.13",
  "zeroconf==0.151.5",
  "uv>=0.8.0",
  "numpy==2.3.5",
  "gql[all]==4.0.0",
  "pyjwt[crypto]>=2.10.1",
  "aiosendspin[server]==10.3.0",
  "av==19.0.2",
  "soxr==1.1.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-binary-package = ["urllib3-future"]
