name: Echo Dot (2nd gen) Linux kernel (Biscuit)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/biscuit-kernel.yml'
      - 'devices/biscuit/packaging/kernel*'
      - 'devices/biscuit/packaging/KERNEL-SOURCE.md'
      - 'devices/biscuit/packaging/package.py'
      - 'tools/check_ble_kernel.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/biscuit-kernel.yml'
      - 'devices/biscuit/packaging/kernel*'
      - 'devices/biscuit/packaging/KERNEL-SOURCE.md'
      - 'devices/biscuit/packaging/package.py'
      - 'tools/check_ble_kernel.py'

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    env:
      ENCORE_KERNEL_BUILD_IMAGE: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    steps:
      - name: Install kernel build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make gcc libc6-dev libssl-dev bc patch curl xz-utils bzip2 \
            perl python3 flex bison util-linux
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Only source archives are cached; the recipe verifies their locked hashes.
      # Build outputs are never restored from an unqualified binary cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .amp/in/orb-backup/biscuit-kernel/dl
          key: biscuit-kernel-sources-${{ hashFiles('devices/biscuit/packaging/kernel-inputs.json') }}
      - name: Build and verify the kernel and source kit
        run: |
          # Checkout's container action and this shell can use different HOME paths.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make biscuit-kernel
      # Do not upload the kernel or source kit while the embedded audio FPGA
      # firmware's redistribution terms remain unresolved; see KERNEL-SOURCE.md.
      # Building and verifying these inputs is separate from distributing them.
      # No release publication, signing, flashing or hardware qualification.
