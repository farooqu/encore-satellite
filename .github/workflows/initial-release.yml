name: Initial dev candidate

on:
  workflow_dispatch:
    inputs:
      build_candidate:
        type: boolean
        default: false
        description: Build the pinned existing reservations (otherwise validate only; never publish)

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      vars.INITIAL_RELEASE_BUILD_SETUP_APPROVED == 'true'
    environment: dev-release-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.pin.outputs.source }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Read the reviewed source pin (no user-supplied source or revisions)
        id: pin
        working-directory: tooling
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          source = json.load(open('release/initial-dev.json'))['source']
          assert re.fullmatch('[0-9a-f]{40}', source), 'full source pin required'
          print('source=' + source)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pin.outputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing reservations, source, inputs and exact-source CI
        working-directory: tooling
        env:
          SOURCE: ${{ steps.pin.outputs.source }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add // []' > "$RUNNER_TEMP/releases.json"
          for workflow in check.yml android.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE&event=push&per_page=100" > "$RUNNER_TEMP/$workflow.json"
          done
          python3 release/dev.py initial-plan --source-tree ../source \
            --releases "$RUNNER_TEMP/releases.json" \
            --ci-runs "$RUNNER_TEMP/check.yml.json" "$RUNNER_TEMP/android.yml.json" \
            --output "$RUNNER_TEMP/initial-plan"
          cat "$RUNNER_TEMP/initial-plan/changelog.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse a second initial assembly attempt
        if: inputs.build_candidate
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo, current = os.environ['GITHUB_REPOSITORY'], int(os.environ['GITHUB_RUN_ID'])
          def pages(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp', endpoint]))
          for page in pages(f'repos/{repo}/actions/workflows/initial-release.yml/runs?event=workflow_dispatch&per_page=100'):
              for run in page['workflow_runs']:
                  if run['id'] == current:
                      continue
                  for jobs in pages(f'repos/{repo}/actions/runs/{run["id"]}/jobs?filter=all&per_page=100'):
                      for job in jobs['jobs']:
                          if job['name'] == 'Build initial dev cohort' and job.get('started_at') and job['conclusion'] != 'skipped':
                              raise SystemExit('An initial build already started. Recover retained bytes or coordinate new reservations; never redispatch/rebuild consumed identities.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initial-dev-plan-${{ github.sha }}
          path: ${{ runner.temp }}/initial-plan
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build initial dev cohort
    needs: preflight
    if: inputs.build_candidate && github.run_attempt == '1'
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_UPDATE_BASE_URL: ${{ vars.ANDROID_UPDATE_BASE_URL }}
      ENCORE_UPDATE_PUBLIC_KEY: ${{ vars.ANDROID_UPDATE_PUBLIC_KEY }}
      EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the recorded Biscuit18 assembly tool, including gzip behavior.
          python-version: '3.13.5'
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK and build/test tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          sudo apt-get update
          sudo apt-get install -y busybox cmake ninja-build g++ openssh-client iptables iproute2 iputils-ping
      - name: Validate tooling and selected source before loading the APK key
        run: |
          set -euo pipefail
          git -C tooling fetch origin main
          test "$(git -C tooling rev-parse HEAD)" = "$(git -C tooling rev-parse origin/main)"
          python3 -m unittest discover -s tooling/release -p 'test_*.py' -v
          python3 source/release/check.py
          python3 source/docs/device-packages/validate.py
      - name: Build and inspect both targets twice (no metadata signing or publishing)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ENCORE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ENCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ENCORE_KEYSTORE="$RUNNER_TEMP/encore.jks"
          trap 'rm -f "$ENCORE_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ENCORE_KEYSTORE"
          python3 tooling/release/dev.py build --initial-source "$GITHUB_WORKSPACE/source" \
            --output "$GITHUB_WORKSPACE/initial-dev-candidate" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initial-dev-candidate-${{ needs.preflight.outputs.source }}
          path: initial-dev-candidate
          retention-days: 30
          if-no-files-found: error
