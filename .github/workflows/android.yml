name: Android Tablet · Checks and Dev release
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('Automatic Dev · {0}', github.event.workflow_run.head_sha) ||
      github.event_name == 'pull_request' && format('PR #{0} · APK checks', github.event.pull_request.number) ||
      github.event_name == 'workflow_dispatch' && inputs.signed_candidate && 'Manual · Signed APK candidate' ||
      format('APK checks · {0}', github.ref_name) }}

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_run:
    # Match the old display name for in-flight runs and historical reruns.
    workflows: ['CI · Repository checks', 'Foundation checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_candidate:
        type: boolean
        default: false
        description: Build a signed candidate (no feed or release publication)

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    # Allow the protected-main workflow_run to save dependencies after its checks pass.
    # The protected signing job does not restore this cache.
    cache-mode: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      core: ${{ steps.dev.outputs.core }}
      revision: ${{ steps.dev.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a source with selective Dev planning
        if: github.event_name == 'workflow_run'
        id: planning
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git rev-list --first-parent origin/main | grep -Fx "$SOURCE" >/dev/null
          if test -f release/dev_plan.py; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.planning.outputs.enabled == 'true'
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select an eligible verified main commit
        id: dev
        if: >-
          steps.planning.outputs.enabled == 'true' ||
          (github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
           github.event_name == 'workflow_dispatch' && inputs.signed_candidate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE" --jq '.commit.verification.verified' | grep -Fx true
          test "$(git rev-parse HEAD)" = "$SOURCE"
          identity=$(python3 release/biscuit_dev.py "$SOURCE")
          test -n "$identity" || exit 0
          read -r core revision extra <<< "$identity"
          [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$revision" =~ ^[1-9][0-9]*$ &&
            "$revision" -gt 8 && "$revision" -le 2100000000 && -z "$extra" ]]
          if test "$GITHUB_EVENT_NAME" = workflow_run; then
            plan="$RUNNER_TEMP/dev-release-plan/plan.json"
            jq -e --arg source "$SOURCE" --arg version "$core" --argjson revision "$revision" \
              '.source == $source and .version == $version and .revision == $revision' "$plan" >/dev/null
            if ! jq -e '.targets | index("android-generic") != null' "$plan" >/dev/null; then exit 0; fi
          fi
          printf 'core=%s\nrevision=%s\n' "$core" "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        with:
          go-version: '1.27.4'
          cache: false
      - name: Use Java 21
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        with:
          packages: platform-tools
      - name: Install SDK and NDK
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
      - name: Install AEC3 build tools
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Cache Gradle modules and Robolectric SDKs
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-2.*
            ~/.m2/repository/org/robolectric/android-all-instrumented
          # build-android pins SendspinDroid, whose checkout supplies Gradle and shared modules.
          key: android-maven-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devices/android-generic/**/*.gradle.kts', 'devices/android-generic/gradle.properties', 'devices/android-generic/build-android') }}
          # Borrow downloaded dependencies, not task outputs. Save under this app's own key.
          restore-keys: |
            android-maven-v1-${{ runner.os }}-${{ runner.arch }}-
            android-assistant-maven-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Regenerate engine, assemble, test and lint
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        run: devices/android-generic/build-android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Exercise release assembly and inspection with a disposable key
        if: github.event_name != 'workflow_run' || steps.dev.outputs.revision != ''
        env:
          ENCORE_STORE_PASSWORD: ci-only
          ENCORE_KEY_PASSWORD: ci-only
          ENCORE_KEY_ALIAS: ci-only
          ENCORE_VERSION_CODE: '3'
          ENCORE_VERSION_NAME: 'ci-only'
          ENCORE_UPDATE_BASE_URL: https://updates.invalid
        run: |
          set -euo pipefail
          umask 077
          export ENCORE_KEYSTORE="$RUNNER_TEMP/ci-only.p12"
          trap 'rm -f "$ENCORE_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$ENCORE_KEYSTORE" -storepass:env ENCORE_STORE_PASSWORD \
            -alias "$ENCORE_KEY_ALIAS" -keyalg RSA -keysize 2048 -dname 'CN=Encore CI only' -validity 1
          export ENCORE_UPDATE_PUBLIC_KEY="$(openssl genpkey -algorithm ED25519 | openssl pkey -pubout -outform DER | tail -c 32 | base64 -w0)"
          cert="$(keytool -exportcert -keystore "$ENCORE_KEYSTORE" -storepass:env ENCORE_STORE_PASSWORD -alias "$ENCORE_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          SKIP_GO_BIND=1 devices/android-generic/build-android :app:assembleRelease
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python3 release/pipeline.py inspect-android devices/android-generic/app/build/outputs/apk/release/app-release.apk \
            --revision "$ENCORE_VERSION_CODE" --version "$ENCORE_VERSION_NAME" --certificate-sha256 "$cert"
          python3 release/android_dev.py devices/android-generic/app/build/outputs/apk/release/app-release.apk

  signed-candidate:
    needs: check
    if: needs.check.outputs.revision != ''
    # Automatic Dev and the existing reviewed manual candidate use different environments.
    environment: ${{ github.event_name == 'workflow_run' && 'android-dev-signing' || 'android-signing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      core_version: ${{ needs.check.outputs.core }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
      signed_artifact: ${{ steps.receipt.outputs.signed_artifact }}
      signed_feed_artifact: ${{ steps.receipt.outputs.signed_feed_artifact }}
    env:
      SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
      ENCORE_CORE_VERSION: ${{ needs.check.outputs.core }}
      ENCORE_VERSION_CODE: ${{ needs.check.outputs.revision }}
      ENCORE_VERSION_NAME: ${{ needs.check.outputs.core }}
      ENCORE_UPDATE_BASE_URL: ${{ vars.ANDROID_UPDATE_BASE_URL }}
      ANDROID_METADATA_PUBLIC_KEY_PEM: ${{ vars.ANDROID_METADATA_PUBLIC_KEY_PEM }}
      ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate identity and derive the APK's feed trust root
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python3 release/check.py
          python3 - <<'PY'
          import base64, os, re, subprocess
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['ANDROID_CERTIFICATE_SHA256']), 'expected pinned APK certificate SHA-256'
          der = subprocess.check_output(['openssl', 'pkey', '-pubin', '-outform', 'DER'],
                                        input=os.environ['ANDROID_METADATA_PUBLIC_KEY_PEM'].encode())
          prefix = bytes.fromhex('302a300506032b6570032100')  # RFC 8410 Ed25519 SPKI
          assert len(der) == len(prefix) + 32 and der.startswith(prefix), 'Android metadata root must be Ed25519'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              print('ENCORE_UPDATE_PUBLIC_KEY=' + base64.b64encode(der[len(prefix):]).decode(), file=env)
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
      - name: Install AEC3 build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Build signed candidate with private keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ENCORE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ENCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ENCORE_KEYSTORE="$RUNNER_TEMP/encore.jks"
          trap 'rm -f "$ENCORE_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ENCORE_KEYSTORE"
          unset KEYSTORE_BASE64
          apk=devices/android-generic/app/build/outputs/apk/release/app-release.apk
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          if test "$GITHUB_EVENT_NAME" = workflow_run; then
            work="$RUNNER_TEMP/android-build"
            mkdir "$work"
            devices/android-generic/build-android clean :app:assembleRelease --no-build-cache
            cp "$apk" "$work/encore-android.apk"
            # Recompile both native AEC ABIs, recreate the Go AAR and clean Gradle outputs.
            rm -rf build/android/aec/{arm64-v8a,armeabi-v7a,jniLibs}
            devices/android-generic/build-android clean :app:assembleRelease :app:collectReleaseDependencySources --no-build-cache
            cp "$apk" "$work/repeat.apk"
          else
            devices/android-generic/build-android :app:assembleRelease
            python3 release/pipeline.py inspect-android "$apk" --revision "$ENCORE_VERSION_CODE" \
              --core-version "$ENCORE_CORE_VERSION" --version "$ENCORE_VERSION_NAME" \
              --certificate-sha256 "$ANDROID_CERTIFICATE_SHA256"
            python3 release/android_dev.py "$apk"
            sha256sum "$apk" > "$apk.sha256"
            git rev-parse HEAD > "$apk.source"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: android-incubator-candidate-${{ needs.check.outputs.revision }}-${{ github.run_attempt }}-${{ github.sha }}
          path: devices/android-generic/app/build/outputs/apk/release/app-release.apk*
          if-no-files-found: error
          retention-days: 30
      - name: Verify the repeat build and prepare the release receipt
        if: github.event_name == 'workflow_run'
        id: receipt
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python3 release/android_dev.py "$RUNNER_TEMP/android-build" "$RUNNER_TEMP/android-release"
          sha=$(sha256sum "$RUNNER_TEMP/android-release/receipt.json" | cut -d ' ' -f 1)
          printf 'sha256=%s\nsigned_artifact=android-dev-signed-%s\nsigned_feed_artifact=android-dev-signed-feed-%s\n' \
            "$sha" "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'workflow_run'
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Sign the Android receipt and Dev entry with the APK's OTA root
        if: github.event_name == 'workflow_run'
        env:
          PRIVATE_KEY: ${{ secrets.ANDROID_METADATA_KEY_PEM }}
          RECEIPT_SHA256: ${{ steps.receipt.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_KEY"
          key=$(mktemp "$RUNNER_TEMP/android-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          unset PRIVATE_KEY
          root="$RUNNER_TEMP/android-root.pem"
          printf '%s\n' "$ANDROID_METADATA_PUBLIC_KEY_PEM" > "$root"
          cmp -s <(openssl pkey -in "$key" -pubout -outform DER) <(openssl pkey -pubin -in "$root" -outform DER)
          candidate="$RUNNER_TEMP/android-release"
          feed="$RUNNER_TEMP/android-feed"
          mkdir "$feed"
          python3 release/pipeline.py sign-receipt "$candidate" --key "$key" --receipt-sha256 "$RECEIPT_SHA256"
          python3 release/pipeline.py verify "$candidate" --public-key "$root" --receipt-sha256 "$RECEIPT_SHA256"
          issued=$(date +%s)
          python3 release/pipeline.py feed "$candidate" --key "$key" --public-key "$root" \
            --receipt-sha256 "$RECEIPT_SHA256" --channel dev --issued "$issued" \
            --dev-plan "$RUNNER_TEMP/dev-release-plan/plan.json" \
            --expires "$((issued + 604800))" --output "$feed/dev.jws"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_run'
        with:
          name: ${{ steps.receipt.outputs.signed_artifact }}
          path: ${{ runner.temp }}/android-release
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_run'
        with:
          name: ${{ steps.receipt.outputs.signed_feed_artifact }}
          path: ${{ runner.temp }}/android-feed/dev.jws
          if-no-files-found: error

  retain-dev:
    needs: signed-candidate
    if: github.event_name == 'workflow_run' && needs.signed-candidate.outputs.receipt_sha256 != ''
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/retain-release.yml
    with:
      target: android-generic
      signed_artifact: ${{ needs.signed-candidate.outputs.signed_artifact }}
      receipt_sha256: ${{ needs.signed-candidate.outputs.receipt_sha256 }}
      plan_run: ${{ format('{0}', github.event.workflow_run.id) }}

  advance-dev:
    needs: [signed-candidate, retain-dev]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/activate-feed.yml
    with:
      target: android-generic
      version: ${{ needs.signed-candidate.outputs.core_version }}
      signed_feed_artifact: ${{ needs.signed-candidate.outputs.signed_feed_artifact }}
      receipt_sha256: ${{ needs.signed-candidate.outputs.receipt_sha256 }}
