name: Release · Update OTA feed

on:
  workflow_call:
    inputs:
      signed_feed_artifact:
        description: Same-run artifact containing the protected signer's dev.jws
        required: true
        type: string
      target:
        required: true
        type: string
      version:
        required: true
        type: string
      receipt_sha256:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Expected platform and signing root
        type: choice
        options: [android-generic, biscuit]
        default: android-generic
      version:
        description: Retained core version (no tag prefix)
        type: string
        required: true
      channel:
        description: Stable activation requires explicit promotion
        type: choice
        options: [dev, stable]
        required: true
      staging_tag:
        description: Draft release holding the reviewed signed dev.jws or stable.jws
        type: string
        required: true
      receipt_sha256:
        description: Independently reviewed retained receipt.json SHA256
        type: string
        required: true
      activate:
        description: Push feed checkpoints and deploy Pages; false validates locally only
        type: boolean
        default: false
      promote_stable:
        description: Explicitly select this exact release for Stable (also requires activate)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    if: >-
      github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'workflow_dispatch' || (inputs.signed_feed_artifact != '' &&
       (github.event_name == 'workflow_run' || github.event_name == 'push')))
    concurrency:
      group: release-publication
      queue: max
    environment: ${{ inputs.signed_feed_artifact != '' && 'release-dev-feeds' || 'release-feeds' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.signed_feed_artifact != '' && 'dev' || inputs.channel }}
      ACTIVATE: ${{ inputs.signed_feed_artifact != '' || inputs.activate }}
      PROMOTE_STABLE: ${{ inputs.promote_stable }}
      SIGNED_FEED_ARTIFACT: ${{ inputs.signed_feed_artifact }}
      STAGING_TAG: ${{ inputs.staging_tag }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      ANDROID_PUBLIC_KEY: ${{ vars.ANDROID_METADATA_PUBLIC_KEY_PEM }}
      BISCUIT_PUBLIC_KEY: ${{ vars.BISCUIT_METADATA_PUBLIC_KEY_PEM }}
      EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
      SETUP_APPROVED: ${{ vars.RELEASE_SETUP_APPROVED }}
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      - name: Require owner-approved setup and explicit Stable promotion
        if: env.ACTIVATE == 'true'
        run: |
          case "$CHANNEL" in
            dev) ;;
            stable)
              if test "$PROMOTE_STABLE" != true || test -n "$SIGNED_FEED_ARTIFACT"; then
                echo '::error::Stable requires explicit promotion of the reviewed release.'
                exit 1
              fi ;;
            *) exit 1 ;;
          esac
          if test "$SETUP_APPROVED" != true; then
            echo '::error::Activation is disabled until RELEASE_SETUP_APPROVED is explicitly configured.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm checked-in publication approval
        if: env.ACTIVATE == 'true'
        run: |
          if test -n "$SIGNED_FEED_ARTIFACT"; then
            jq -e --arg target "$TARGET" '.automatic_dev_targets | index($target) != null' release/dev-automation.json >/dev/null
          else
            jq -e '.publishing_enabled == true' release/dev-automation.json >/dev/null
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.signed_feed_artifact != ''
        with:
          name: ${{ inputs.signed_feed_artifact }}
          path: ${{ runner.temp }}/feed
      - name: Verify immutable release and signed channel selection
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.+-]+)?$ ]]
          case "$TARGET" in
            android-generic)
              tag="android-$VERSION"
              public_key="$ANDROID_PUBLIC_KEY"
              ;;
            biscuit)
              tag="biscuit-$VERSION"
              public_key="$BISCUIT_PUBLIC_KEY"
              ;;
            *) exit 1 ;;
          esac
          test -n "$public_key"
          printf '%s\n' "$public_key" > "$RUNNER_TEMP/root.pem"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.immutable == true and .draft == false' | grep -Fx true
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/candidate"
          if test -z "$SIGNED_FEED_ARTIFACT"; then
            # Draft lookup must use the CLI's draft-aware release discovery.
            gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -Fx true
            gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CHANNEL.jws" --dir "$RUNNER_TEMP/feed"
          fi
          export CANDIDATE="$RUNNER_TEMP/candidate"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          r = json.loads((Path(os.environ['CANDIDATE']) / 'receipt.json').read_text())
          assert r['target'] == os.environ['TARGET'], 'release target mismatch'
          assert r['core_version'] == os.environ['VERSION'], 'release identity mismatch'
          if r['target'] == 'android-generic':
              assert r['compatibility']['certificate_sha256'] == os.environ['EXPECTED_CERTIFICATE'], 'unexpected APK signer'
              if os.environ['SIGNED_FEED_ARTIFACT']:
                  assert r.get('identity') == 'main', 'automatic Android activation requires a main-derived identity'
          subprocess.run(['git', 'merge-base', '--is-ancestor', r['source'], 'HEAD'], check=True)
          if r['target'] == 'biscuit' or r.get('identity') == 'main':
              history = subprocess.check_output(['git', 'rev-list', '--first-parent', 'HEAD'], text=True).splitlines()
              assert r['source'] in history, 'Release source must be a first-parent main commit'
          PY
          # This branch must be deliberately bootstrapped; a missing checkpoint
          # branch is an error, not permission to discard old feeds/history.
          git worktree add --detach build/feed-site origin/release-feeds
          python3 release/pipeline.py stage-feed "$CANDIDATE" \
            --public-key "$RUNNER_TEMP/root.pem" --receipt-sha256 "$RECEIPT_SHA256" \
            --channel "$CHANNEL" --feed "$RUNNER_TEMP/feed/$CHANNEL.jws" --site build/feed-site
      - name: Explicitly save feed checkpoints and stage Pages
        if: env.ACTIVATE == 'true'
        run: |
          set -euo pipefail
          git -C build/feed-site config user.name github-actions[bot]
          git -C build/feed-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C build/feed-site add --all
          if ! git -C build/feed-site diff --cached --quiet; then
            git -C build/feed-site commit -m "Select $TARGET release $VERSION on $CHANNEL"
          fi
          # No force push; another writer causes failure instead of lost feeds.
          git -C build/feed-site -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/release-feeds
          mkdir "$RUNNER_TEMP/pages"
          git -C build/feed-site archive HEAD | tar -x -C "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: env.ACTIVATE == 'true'
        id: pages
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/pages
      - name: Wait for Pages artifact visibility and propagation
        if: env.ACTIVATE == 'true'
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fx "$ARTIFACT_ID" >/dev/null; then
              # deploy-pages uses a separate listing that can lag behind REST.
              # https://github.com/actions/deploy-pages/issues/451
              sleep 15
              exit 0
            fi
            if test "$attempt" -lt 10; then sleep 3; fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT ($ARTIFACT_ID) did not become visible."
          exit 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: env.ACTIVATE == 'true'
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
