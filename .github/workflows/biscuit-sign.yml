name: Biscuit · Sign and deliver Dev
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('Automatic Dev · {0}', github.event.workflow_run.head_sha) ||
      inputs.operation == 'check-gate' && 'Manual · Check signing gate' ||
      inputs.operation == 'deliver-dev' && format('Manual · Deliver Dev candidate {0}', inputs.source) ||
      format('Manual · Sign candidate {0}', inputs.source) }}

on:
  workflow_run:
    # Match the old display name for in-flight runs and historical reruns.
    workflows: ['Biscuit · Build Dev packages', 'Biscuit ARM64 dev builds']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Check the gate, sign an exact candidate, or deliver a reviewed Dev retry
        type: choice
        options: [check-gate, sign, deliver-dev]
        default: check-gate
      build_run:
        description: For signing, successful Biscuit ARM64 build run ID
        type: string
      source:
        description: For signing, exact first-parent main SHA in the reviewed receipt
        type: string
      receipt_sha256:
        description: For signing, reviewed unsigned receipt.json SHA256
        type: string
      channel:
        description: Also sign a feed entry; manual signing never publishes or deploys
        type: choice
        options: [none, stable, dev]
        default: none

permissions:
  actions: read
  contents: read

jobs:
  eligible-main-build:
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'farooqu/encore-satellite' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require armed policy and an actual unsigned release artifact
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! jq -e '.automatic_dev_targets | index("biscuit") != null' release/dev-automation.json >/dev/null; then
            exit 0
          fi
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts")
          if jq -e 'any(.artifacts[]; .name == "biscuit-native-unsigned" and .expired == false)' <<< "$artifacts" >/dev/null; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

  sign:
    needs: eligible-main-build
    if: >-
      !cancelled() && github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'workflow_dispatch' || needs.eligible-main-build.outputs.eligible == 'true')
    environment: biscuit-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      core_version: ${{ steps.release.outputs.core_version }}
      receipt_sha256: ${{ steps.candidate.outputs.receipt_sha256 }}
      plan_run: ${{ steps.candidate.outputs.plan_run }}
    env:
      BUILD_RUN: ${{ github.event.workflow_run.id || inputs.build_run }}
      OPERATION: ${{ inputs.operation }}
      SOURCE: ${{ inputs.source }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      CHANNEL: ${{ (github.event_name == 'workflow_run' || inputs.operation == 'deliver-dev') && 'dev' || inputs.channel }}
    steps:
      - name: Confirm environment approval without accessing secrets
        if: inputs.operation == 'check-gate'
        run: echo 'The biscuit-signing environment released this job. No credentials or candidate accessed.' >> "$GITHUB_STEP_SUMMARY"
      # Run only the separately approved signing workflow's code, never check
      # out the input candidate SHA or run code from the candidate artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'workflow_run' || inputs.operation == 'sign' || inputs.operation == 'deliver-dev'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the exact reviewed candidate from this repository
        id: candidate
        if: github.event_name == 'workflow_run' || inputs.operation == 'sign' || inputs.operation == 'deliver-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg event "$GITHUB_EVENT_NAME" '
            .path == ".github/workflows/biscuit-arm64-dev.yml" and .head_repository.full_name == $repo and
            .head_branch == "main" and .conclusion == "success" and
            (.event == "workflow_run" or ($event == "workflow_dispatch" and .event == "workflow_dispatch"))' > /dev/null
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name biscuit-native-unsigned --dir "$RUNNER_TEMP/candidate"
          receipt="$RUNNER_TEMP/candidate/receipt.json"
          if test "$GITHUB_EVENT_NAME" = workflow_run; then
            SOURCE=$(jq -er '.source' "$receipt")
            RECEIPT_SHA256=$(sha256sum "$receipt" | cut -d ' ' -f 1)
          fi
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ && "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git rev-list --first-parent HEAD | grep -Fx "$SOURCE" > /dev/null
          printf '%s  %s\n' "$RECEIPT_SHA256" "$receipt" | sha256sum -c -
          jq -e --arg source "$SOURCE" '.target == "biscuit" and .source == $source and
            .compatibility.format == "encore-biscuit-native-ab-v1"' "$receipt" > /dev/null
          printf 'SOURCE=%s\nRECEIPT_SHA256=%s\n' "$SOURCE" "$RECEIPT_SHA256" >> "$GITHUB_ENV"
          printf 'receipt_sha256=%s\n' "$RECEIPT_SHA256" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = workflow_run || test "$OPERATION" = deliver-dev; then
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts?name=dev-release-plan")
            if jq -e 'any(.artifacts[]; .expired == false)' <<< "$artifacts" >/dev/null; then
              printf 'plan_run=%s\n' "$BUILD_RUN" >> "$GITHUB_OUTPUT"
            elif test -n "$(git ls-tree --name-only "$SOURCE" -- release/dev_plan.py)" && test "$GITHUB_EVENT_NAME" = workflow_run; then
              echo '::error::Missing the Dev release plan for this automatic build.'
              exit 1
            fi
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.candidate.outputs.plan_run != ''
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          run-id: ${{ steps.candidate.outputs.plan_run }}
          github-token: ${{ github.token }}
      - name: Sign the receipt and optional feed with the pinned Ed25519 root
        if: steps.candidate.outputs.receipt_sha256 != ''
        env:
          PRIVATE_KEY: ${{ secrets.BISCUIT_METADATA_PRIVATE_KEY_PEM }}
          PUBLIC_KEY: ${{ vars.BISCUIT_METADATA_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_KEY" && test -n "$PUBLIC_KEY"
          key=$(mktemp "$RUNNER_TEMP/biscuit-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          unset PRIVATE_KEY
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/biscuit-root.pem"
          candidate="$RUNNER_TEMP/candidate"
          python3 release/pipeline.py sign-receipt "$candidate" --key "$key" --receipt-sha256 "$RECEIPT_SHA256"
          python3 release/pipeline.py verify "$candidate" --public-key "$RUNNER_TEMP/biscuit-root.pem" --receipt-sha256 "$RECEIPT_SHA256"
          case "$CHANNEL" in
            stable|dev)
              issued=$(date +%s)
              mkdir "$RUNNER_TEMP/signed-feed"
              notes=()
              if test -f "$RUNNER_TEMP/dev-release-plan/plan.json"; then
                notes=(--dev-plan "$RUNNER_TEMP/dev-release-plan/plan.json")
              fi
              python3 release/pipeline.py feed "$candidate" --key "$key" --public-key "$RUNNER_TEMP/biscuit-root.pem" \
                --receipt-sha256 "$RECEIPT_SHA256" --channel "$CHANNEL" --issued "$issued" "${notes[@]}" \
                --expires "$((issued + 604800))" --output "$RUNNER_TEMP/signed-feed/$CHANNEL.jws"
              ;;
            none) ;;
            *) exit 1 ;;
          esac
          printf 'Signed Biscuit native candidate `%s` from `%s`. Receipt SHA256: `%s`.\n' \
            "$BUILD_RUN" "$SOURCE" "$RECEIPT_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.candidate.outputs.receipt_sha256 != ''
        with:
          name: biscuit-native-signed
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.candidate.outputs.receipt_sha256 != '' && env.CHANNEL != 'none'
        with:
          name: biscuit-native-signed-feed
          path: ${{ runner.temp }}/signed-feed
          if-no-files-found: error
      - name: Route the verified release
        id: release
        if: github.event_name == 'workflow_run' || inputs.operation == 'deliver-dev'
        run: |
          set -euo pipefail
          core=$(jq -er '.core_version' "$RUNNER_TEMP/candidate/receipt.json")
          printf 'core_version=%s\n' "$core" >> "$GITHUB_OUTPUT"

  retain-dev:
    needs: sign
    # The automatic preflight is skipped for a dispatch. Check the direct
    # dependency explicitly rather than relying on transitive success().
    if: >-
      !cancelled() && needs.sign.result == 'success' &&
      (github.event_name == 'workflow_run' || inputs.operation == 'deliver-dev')
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/retain-release.yml
    with:
      signed_artifact: biscuit-native-signed
      target: biscuit
      receipt_sha256: ${{ needs.sign.outputs.receipt_sha256 }}
      plan_run: ${{ needs.sign.outputs.plan_run }}

  advance-dev:
    needs: [sign, retain-dev]
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.retain-dev.result == 'success' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/activate-feed.yml
    with:
      signed_feed_artifact: biscuit-native-signed-feed
      target: biscuit
      version: ${{ needs.sign.outputs.core_version }}
      receipt_sha256: ${{ needs.sign.outputs.receipt_sha256 }}
