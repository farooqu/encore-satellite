name: Release · Publish GitHub assets

on:
  workflow_call:
    inputs:
      signed_artifact:
        description: Same-run artifact from the protected release signer
        required: true
        type: string
      target:
        required: true
        type: string
      receipt_sha256:
        required: true
        type: string
      plan_run:
        description: Run containing the Dev release plan for this exact candidate
        type: string
  workflow_dispatch:
    inputs:
      staging_tag:
        description: Draft release containing ONLY prepared assets, receipt.json and receipt.jws
        required: true
        type: string
      target:
        description: Expected target (selects the pinned metadata root)
        required: true
        type: choice
        options: [biscuit, android-generic]
      receipt_sha256:
        description: Independently reviewed receipt.json SHA256
        required: true
        type: string
      publish:
        description: Publish immutable release assets; false verifies and prints a dry-run only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retain:
    if: >-
      github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'workflow_dispatch' || (inputs.signed_artifact != '' &&
       (github.event_name == 'workflow_run' || github.event_name == 'push')))
    concurrency:
      group: release-publication
      queue: max
    environment: ${{ inputs.signed_artifact != '' && 'release-dev-publication' || 'release-publication' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_TAG: ${{ inputs.staging_tag }}
      TARGET: ${{ inputs.target }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      PUBLISH: ${{ inputs.signed_artifact != '' || inputs.publish }}
      SIGNED_ARTIFACT: ${{ inputs.signed_artifact }}
      SETUP_APPROVED: ${{ vars.RELEASE_SETUP_APPROVED }}
      BISCUIT_PUBLIC_KEY: ${{ vars.BISCUIT_METADATA_PUBLIC_KEY_PEM }}
      ANDROID_PUBLIC_KEY: ${{ vars.ANDROID_METADATA_PUBLIC_KEY_PEM }}
      EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - name: Refuse publication before owner-approved setup
        run: |
          if test "$PUBLISH" = true && test "$SETUP_APPROVED" != true; then
            echo '::error::Publishing is disabled until RELEASE_SETUP_APPROVED is explicitly configured.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm checked-in publication approval
        if: env.PUBLISH == 'true'
        run: |
          if test -n "$SIGNED_ARTIFACT"; then
            jq -e --arg target "$TARGET" '.automatic_dev_targets | index($target) != null' release/dev-automation.json >/dev/null
          else
            jq -e '.publishing_enabled == true' release/dev-automation.json >/dev/null
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.signed_artifact != ''
        with:
          name: ${{ inputs.signed_artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.plan_run != ''
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          run-id: ${{ inputs.plan_run }}
          github-token: ${{ github.token }}
      - name: Download and verify the exact staged candidate
        run: |
          set -euo pipefail
          case "$TARGET" in
            biscuit) public_key="$BISCUIT_PUBLIC_KEY" ;;
            android-generic) public_key="$ANDROID_PUBLIC_KEY" ;;
            *) exit 1 ;;
          esac
          test -n "$public_key"
          printf '%s\n' "$public_key" > "$RUNNER_TEMP/root.pem"
          if test -z "$SIGNED_ARTIFACT"; then
            # REST's by-tag endpoint finds published releases, not staging drafts.
            gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -Fx true
            gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/candidate"
          fi
          export CANDIDATE="$RUNNER_TEMP/candidate"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          r = json.loads((Path(os.environ['CANDIDATE']) / 'receipt.json').read_text())
          assert r['target'] == os.environ['TARGET'], 'unexpected target/root'
          if r['target'] == 'android-generic':
              assert r['compatibility']['certificate_sha256'] == os.environ['EXPECTED_CERTIFICATE'], 'unexpected APK signer'
              if os.environ['SIGNED_ARTIFACT']:
                  assert r.get('identity') == 'main', 'automatic Android publication requires a main-derived identity'
          subprocess.run(['git', 'merge-base', '--is-ancestor', r['source'], 'HEAD'], check=True)
          if r['target'] == 'biscuit' or r.get('identity') == 'main':
              history = subprocess.check_output(['git', 'rev-list', '--first-parent', 'HEAD'], text=True).splitlines()
              assert r['source'] in history, 'Release source must be a first-parent main commit'
          PY
          python3 release/check.py --base origin/main --head HEAD
          python3 release/pipeline.py verify "$CANDIDATE" --public-key "$RUNNER_TEMP/root.pem" --receipt-sha256 "$RECEIPT_SHA256"
      - name: Plan or explicitly publish immutable assets (never feeds)
        env:
          IMMUTABILITY_READ_TOKEN: ${{ inputs.signed_artifact == '' && secrets.IMMUTABILITY_READ_TOKEN || '' }}
          PLAN_RUN: ${{ inputs.plan_run }}
        run: |
          set -euo pipefail
          args=()
          if test "$PUBLISH" = true; then args+=(--execute); fi
          if test -n "$SIGNED_ARTIFACT"; then args+=(--automatic-dev); fi
          if test -n "$PLAN_RUN"; then args+=(--dev-plan "$RUNNER_TEMP/dev-release-plan/plan.json"); fi
          python3 release/pipeline.py publish "$RUNNER_TEMP/candidate" \
            --public-key "$RUNNER_TEMP/root.pem" --receipt-sha256 "$RECEIPT_SHA256" "${args[@]}"
