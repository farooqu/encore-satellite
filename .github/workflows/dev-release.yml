name: Main-driven dev candidates

on:
  workflow_run:
    workflows: [Foundation checks, Android APK checks and signing]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# workflow_run may have elevated access. The preview has no write permissions or
# secrets and reads ONLY a successful same-repository main push, never PR code.
permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      source: ${{ steps.source.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Coalesce to current main and check the exact source
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          if test "$SOURCE" != "$(git rev-parse HEAD)"; then
            echo '::notice::Newer main exists; its own successful checks will plan the release.'
            exit 0
          fi
          echo "sha=$SOURCE" >> "$GITHUB_OUTPUT"
      - name: Read published changelog baselines and both CI results
        if: steps.source.outputs.sha != ''
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'add' > "$RUNNER_TEMP/releases.json"
          for workflow in check.yml android.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE&event=push&per_page=100" > "$RUNNER_TEMP/$workflow.json"
          done
      - name: Plan next dev cohort (builds need approved inputs and setup)
        if: steps.source.outputs.sha != ''
        id: plan
        run: |
          python3 release/dev.py plan --releases "$RUNNER_TEMP/releases.json" \
            --ci-runs "$RUNNER_TEMP/check.yml.json" "$RUNNER_TEMP/android.yml.json" \
            --output build/dev-plan --github-output "$GITHUB_OUTPUT"
          cat build/dev-plan/changelog.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.source.outputs.sha != ''
        with:
          name: dev-plan-${{ steps.source.outputs.sha }}
          path: build/dev-plan
          retention-days: 30
          if-no-files-found: error

  reserve:
    # Dispatch is ALWAYS a preview, even after setup. Enabling requires both a
    # reviewed code change AND a separately approved repository variable.
    needs: plan
    if: >-
      github.event_name == 'workflow_run' && github.run_attempt == '1' &&
      needs.plan.outputs.enabled == 'true' &&
      vars.RELEASE_BUILD_SETUP_APPROVED == 'true'
    environment: dev-release-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.reserve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's plan (never a PR artifact)
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "dev-plan-$SOURCE" --dir "$RUNNER_TEMP/dev-plan"
      - name: Append central reservations and commit version/changelog
        id: reserve
        run: |
          set -euo pipefail
          git fetch origin main
          # No rebase/retry/force: another main writer means re-plan, not re-use
          # a version for different source. The push below is the allocation CAS.
          test "$(git rev-parse origin/main)" = "$SOURCE"
          python3 release/dev.py apply "$RUNNER_TEMP/dev-plan/plan.json"
          python3 release/check.py --base origin/main --head HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/targets.json release/ledger.json release/changelogs
          git commit -m "Prepare main dev cohort" -m "Encore-Dev-Source: $SOURCE"
          git -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # GITHUB_TOKEN pushes do not trigger another push workflow. The exact
          # committed release source is tested and built in the next job.

  build:
    needs: reserve
    # Reruns must not create new bytes under a consumed reservation.
    if: github.run_attempt == '1'
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_UPDATE_BASE_URL: ${{ vars.ANDROID_UPDATE_BASE_URL }}
      ENCORE_UPDATE_PUBLIC_KEY: ${{ vars.ANDROID_UPDATE_PUBLIC_KEY }}
      EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.reserve.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK and build/test tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          sudo apt-get update
          sudo apt-get install -y busybox cmake ninja-build g++ openssh-client iptables iproute2 iputils-ping
      - name: Validate the exact release source before loading the APK key
        run: |
          python3 -m unittest discover -s release -p 'test_*.py' -v
          python3 release/check.py --base HEAD^ --head HEAD
          python3 docs/device-packages/validate.py
      - name: Build the whole cohort twice, inspect and retain matching sources
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ENCORE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ENCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ENCORE_KEYSTORE="$RUNNER_TEMP/encore.jks"
          trap 'rm -f "$ENCORE_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ENCORE_KEYSTORE"
          python3 release/dev.py build --output build/dev-candidate \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      # These are intermediate, expiring artifacts, not release/source delivery.
      # Build approval is independent of publication. No metadata keys in CI.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-candidate-${{ needs.reserve.outputs.source }}
          path: build/dev-candidate
          retention-days: 30
          if-no-files-found: error
