name: Foundation checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main push checks feed the release build; never supersede an earlier tip.
  group: foundation-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Inventory and impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected_targets: ${{ steps.select.outputs.affected_targets }}
      package_targets: ${{ steps.select.outputs.package_targets }}
      lab_check: ${{ steps.select.outputs.lab_check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test inventory and selector
        run: python3 -m unittest discover -s release -p 'test_*.py' -v
      - name: Validate planned package scaffold when present
        run: |
          if test -d devices/biscuit || test -d devices/android-generic || test -d docs/device-packages; then
            python3 docs/device-packages/validate.py
            python3 -m unittest discover -s docs/device-packages -p 'test_*.py' -v
          else
            echo '::notice::Package scaffold absent on this branch; no profile validation claimed.'
          fi
      - name: Select impact (missing history selects everything)
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 release/check.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
      - name: Refuse unsupported package builds
        env:
          PACKAGE_TARGETS: ${{ steps.select.outputs.package_targets }}
        run: |
          test "$PACKAGE_TARGETS" = '[]' || {
            echo 'No release package builders are implemented in this foundation.' >&2
            exit 1
          }

  lab-foundation:
    name: Lab boundary, vet, race and build
    needs: impact
    if: needs.impact.outputs.lab_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check dependency boundaries, vet and race tests
        run: make check
      - name: Build the virtual lab (not a device package)
        run: go build -o "$RUNNER_TEMP/encore-lab" ./cmd/encore-lab
      - name: Install Dot boot and builder test tools
        run: sudo apt-get update && sudo apt-get install -y busybox cmake ninja-build g++ iptables iproute2 iputils-ping
      - name: Check and cross-build the experimental Dot package
        run: make biscuit-check biscuit-build
      # Deliberately not make lab-test: it needs pinned HA, onboarding and
      # Amp-supervised service restart support. See release/README.md.

  dev-plan:
    needs: lab-foundation
    if: >-
      github.repository == 'farooqu/encore-satellite' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse an existing plan on reruns
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=dev-release-plan" \
            --jq '"exists=\(any(.artifacts[]; .expired == false))"' >> "$GITHUB_OUTPUT"
      - name: Plan Dev builds and generate the shared changelog
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified' | grep -Fx true
          python3 release/dev_plan.py "$GITHUB_SHA" "$RUNNER_TEMP/dev-release-plan"
          cat "$RUNNER_TEMP/dev-release-plan/"*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          if-no-files-found: error
