name: Biscuit ARM64 dev builds

on:
  workflow_run:
    workflows: [Foundation checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact first-parent main SHA to rebuild (defaults to current main)
        type: string

# Direct pushes to main can change this workflow. It must never have access
# to the Echo Dot signing key or a privileged publication credential.
permissions:
  actions: read
  contents: read

jobs:
  build:
    # workflow_run can have elevated access. Never build or sign PR/fork code.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:13.7-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ github.event.workflow_run.head_sha || inputs.source || github.sha }}
    steps:
      - name: Prepare pinned release environment and planning tools
        run: |
          # Bootstrap HTTPS from the signed snapshot too, so CA installation cannot
          # pull a newer OpenSSL runtime than the snapshot's development headers.
          cat >/etc/apt/sources.list.d/debian.sources <<'EOF'
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/20261120T000000Z/
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/20261120T000000Z/
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          sed -i 's|^URIs: http://|URIs: https://|' /etc/apt/sources.list.d/debian.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git gh jq python3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact first-parent main source
        id: source
        run: |
          set -euo pipefail
          # Checkout trusts the mounted workspace only in its temporary HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git rev-list --first-parent origin/main | grep -Fx "$SOURCE" > /dev/null
          if test -f release/dev_plan.py; then echo 'planning=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'workflow_run' && steps.source.outputs.planning == 'true'
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select the shared release identity and external-input lock
        if: github.event_name == 'workflow_dispatch' || steps.source.outputs.planning == 'true'
        id: inputs
        run: |
          set -euo pipefail
          release=$(python3 release/biscuit_dev.py "$SOURCE")
          if [[ -z "$release" ]]; then
            echo '::notice::This source does not advance an eligible Encore release version.'
            exit 0
          fi
          read -r version revision <<< "$release"
          if test "$GITHUB_EVENT_NAME" = workflow_run; then
            plan="$RUNNER_TEMP/dev-release-plan/plan.json"
            jq -e --arg source "$SOURCE" --arg version "$version" --argjson revision "$revision" \
              '.source == $source and .version == $version and .revision == $revision' "$plan" >/dev/null
            if ! jq -e '.targets | index("biscuit") != null' "$plan" >/dev/null; then exit 0; fi
          fi
          packaging=devices/biscuit/packaging
          # Manual builds and queued runs can still select a pre-move commit.
          if [[ ! -f "$packaging/locked_build.py" ]]; then packaging+=/kernel61; fi
          tag=$(PYTHONPATH="$packaging" python3 -c '
          from locked_build import HERE, read_lock
          print(read_lock((HERE / "ci-inputs.json").read_bytes())["external_bundle_tag"] or "")
          ')
          if [[ -z "$tag" ]]; then
            echo '::notice::No approved external bundle is available; skipping assembly.'
            exit 0
          fi
          printf 'tag=%s\nversion=%s\nrevision=%s\npackaging=%s\n' "$tag" "$version" "$revision" "$packaging" >> "$GITHUB_OUTPUT"
      - name: Install release build tools
        if: steps.inputs.outputs.tag != ''
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            make gcc gcc-aarch64-linux-gnu libc6-dev libssl-dev libelf-dev bc patch curl perl flex bison
      - name: Fetch the locked external inputs (no prebuilt Encore assets)
        if: steps.inputs.outputs.tag != ''
        env:
          INPUT_TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" \
            --jq '.immutable == true and .draft == false' | grep -Fx true
          inputs="$RUNNER_TEMP/inputs"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$inputs" \
            --pattern alpine-apks.tar.gz --pattern alpine-source.tar.gz \
            --pattern apk-tools-static.apk --pattern audited-header.bin
          curl --fail --silent --show-error --location --output "$inputs/linux-source.tar.gz" \
            https://api.github.com/repos/aslater3/LibreEcho-Linux/tarball/5bc811d3cd7091e8d70f9faa0bc12c5cf4e77ae0
          curl --fail --silent --show-error --location --output "$inputs/go-linux-amd64.tar.gz" \
            https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
          curl --fail --silent --show-error --location --output "$inputs/go-source.tar.gz" \
            https://go.dev/dl/go1.27.4.src.tar.gz
      - name: Build starter, OTA, unsigned native A/B candidates and source kits from this commit
        if: steps.inputs.outputs.tag != ''
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          REVISION: ${{ steps.inputs.outputs.revision }}
          PACKAGING: ${{ steps.inputs.outputs.packaging }}
        run: |
          set -euo pipefail
          python3 "$PACKAGING/locked_build.py" \
            --inputs "$RUNNER_TEMP/inputs" --output build/biscuit-arm64-dev \
            --version "$VERSION" --revision "$REVISION"
          git diff --exit-code
          cat build/biscuit-arm64-dev/evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare unsigned native A/B candidate for independent review
        if: steps.inputs.outputs.tag != ''
        run: |
          set -euo pipefail
          python3 release/pipeline.py prepare-native-ci build/biscuit-arm64-dev \
            --output "$RUNNER_TEMP/native-candidate" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_run' && steps.inputs.outputs.tag != ''
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.inputs.outputs.tag != ''
        with:
          name: biscuit-native-unsigned
          path: ${{ runner.temp }}/native-candidate
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.inputs.outputs.tag != ''
        with:
          name: biscuit-arm64-${{ steps.inputs.outputs.version }}
          path: |
            build/biscuit-arm64-dev/primary
            build/biscuit-arm64-dev/repeat
            build/biscuit-arm64-dev/sources
            build/biscuit-arm64-dev/evidence.txt
          if-no-files-found: error
          retention-days: 30
