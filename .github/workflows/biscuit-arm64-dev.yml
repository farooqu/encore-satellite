name: Biscuit ARM64 dev builds

on:
  workflow_run:
    workflows: [Foundation checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Direct pushes to main can change this workflow. It must never have access
# to the Echo Dot signing key or a privileged publication credential.
permissions:
  contents: read

jobs:
  build:
    # workflow_run can have elevated access. Never build or sign PR/fork code.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact first-parent main source
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git rev-list --first-parent origin/main | grep -Fx "$SOURCE" > /dev/null
      - name: Read the input release pinned by this commit
        id: inputs
        run: |
          set -euo pipefail
          tag=$(jq -er '
            if has("release_tag") and has("source_sha256") and .release_tag == null and .source_sha256 == null then ""
            elif (.release_tag | strings | test("\\A[a-zA-Z0-9][a-zA-Z0-9._-]*\\z")) and
                 (.source_sha256 | objects | keys == ["alpine-go-source.tar.gz", "kernel-source.tar.gz"] and
                  all(.[]; type == "string" and test("\\A[0-9a-f]{64}\\z"))) then .release_tag
            else error("expected an immutable release tag and both source SHA-256 pins, or null for both") end
          ' devices/biscuit/packaging/kernel61/ci-inputs.json)
          if [[ -z "$tag" ]]; then
            echo '::notice::No approved ARM64 input release is pinned in this commit; skipping assembly.'
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.inputs.outputs.tag != ''
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.inputs.outputs.tag != ''
        with:
          python-version: '3.12'
      - name: Fetch immutable ARM64 inputs and verify source archives
        if: steps.inputs.outputs.tag != ''
        env:
          INPUT_TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" \
            --jq '.immutable == true and .draft == false' | grep -Fx true
          args=()
          for file in Image biscuit-arm64-probe.dtb audited-header.bin rootfs.tar.gz ca-certificates.crt \
              kernel-source.tar.gz alpine-go-source.tar.gz; do
            args+=(--pattern "$file")
          done
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/inputs" "${args[@]}"
          jq -r '.source_sha256 | to_entries[] | "\(.value)  \(.key)"' \
            devices/biscuit/packaging/kernel61/ci-inputs.json > "$RUNNER_TEMP/source-sha256"
          (cd "$RUNNER_TEMP/inputs" && sha256sum --check --strict "$RUNNER_TEMP/source-sha256")
          # The builder checks the SHA-256 of each of these five files before
          # validating the complete assembled envelope.
      - name: Assemble and compare two fresh-install ZIPs
        id: assemble
        if: steps.inputs.outputs.tag != ''
        env:
          INPUT_TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          identity=$(python3 release/biscuit_dev.py "$SOURCE")
          read -r version revision <<< "$identity"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          inputs="$RUNNER_TEMP/inputs"
          for attempt in one two; do
            python3 devices/biscuit/packaging/kernel61/starter_build.py \
              --sealed-base "$inputs" --ca-bundle "$inputs/ca-certificates.crt" \
              --core-version "$version" --revision "$revision" --output "$RUNNER_TEMP/$attempt"
          done
          cmp "$RUNNER_TEMP/one/starter.zip" "$RUNNER_TEMP/two/starter.zip"
          asset="encore-biscuit-arm64-$version.zip"
          mkdir -p build/biscuit-arm64-dev/{primary,repeat,sources}
          cp "$RUNNER_TEMP/one/starter.zip" "build/biscuit-arm64-dev/primary/$asset"
          cp "$RUNNER_TEMP/two/starter.zip" "build/biscuit-arm64-dev/repeat/$asset"
          mv "$inputs"/{kernel-source.tar.gz,alpine-go-source.tar.gz} build/biscuit-arm64-dev/sources/
          {
            printf 'Unsigned Biscuit ARM64 candidate %s\nSource: %s\nInputs: %s\n' "$version" "$SOURCE" "$INPUT_TAG"
            go version
            python3 --version
            sha256sum build/biscuit-arm64-dev/{primary,repeat}/"$asset" build/biscuit-arm64-dev/sources/*.tar.gz
          } | tee build/biscuit-arm64-dev/evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.inputs.outputs.tag != ''
        with:
          name: biscuit-arm64-${{ steps.assemble.outputs.version }}
          path: build/biscuit-arm64-dev
          if-no-files-found: error
          retention-days: 30
