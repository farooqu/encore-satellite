name: Android Assistant · Checks and Dev release
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('Automatic Dev · {0}', github.event.workflow_run.head_sha) ||
      github.event_name == 'pull_request' && format('PR #{0} · APK checks', github.event.pull_request.number) ||
      inputs.publish && format('Manual · Publish APK {0}', inputs.version) ||
      inputs.sign_only && 'Manual · Signed APK candidate' ||
      format('Manual · Unsigned APK candidate {0}', inputs.version) }}

on:
  pull_request:
  workflow_run:
    # Match the old display name for in-flight runs and historical reruns.
    workflows: ['CI · Repository checks', 'Foundation checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Assistant version name (MAJOR.MINOR.PATCH)
        type: string
        required: true
        default: '0.1.0'
      publish:
        description: Sign and publish an immutable GitHub prerelease from protected main
        type: boolean
        default: false
      sign_only:
        description: Sign the exact protected-main candidate and upload it as a workflow artifact without publishing
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    # Allow protected-main workflow_run jobs to save dependencies; signing never restores them.
    cache-mode: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'workflow_run'
        with:
          name: dev-release-plan
          path: ${{ runner.temp }}/dev-release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select Assistant release identity and policy
        id: release
        env:
          MANUAL_PUBLISH: ${{ inputs.publish == true }}
          SIGN_ONLY: ${{ inputs.sign_only == true }}
          VERSION: ${{ inputs.version || '0.1.0' }}
          MANUAL_ALLOWED: ${{ github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          if [[ "$MANUAL_PUBLISH" == true && "$SIGN_ONLY" == true ]]; then
            echo '::error::Select either publish or sign_only, not both.'
            exit 1
          fi
          publish=false
          revision=$GITHUB_RUN_NUMBER
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            plan="$RUNNER_TEMP/dev-release-plan/plan.json"
            jq -e --arg source "$SOURCE" '.source == $source and (.targets | type == "array")' "$plan" >/dev/null
            if ! jq -e '.targets | index("android-assistant") != null' "$plan" >/dev/null; then
              echo '::notice::Assistant was not selected in the Dev release plan.'
              exit 0
            fi
            if test -f release/product_versions.py; then
              identity=$(python3 release/product_versions.py "$SOURCE" android-assistant)
            else
              identity=$(python3 release/biscuit_dev.py "$SOURCE")
            fi
            read -r core revision VERSION <<< "$identity"
            VERSION=${VERSION:-$core}
            jq -e --arg core "$core" --arg version "$VERSION" --argjson revision "$revision" \
              '(.identities["android-assistant"] // {core_version: .version, version, revision}) == {core_version: $core, version: $version, revision: $revision}' "$plan" >/dev/null
            jq -e '.automatic_dev_targets | index("android-assistant") != null' release/dev-automation.json >/dev/null
            publish=true
          elif [[ "$MANUAL_PUBLISH" == true ]]; then
            test "$MANUAL_ALLOWED" = true
            jq -e '.publishing_enabled == true' release/dev-automation.json >/dev/null || {
              echo '::error::Manual release publication is disabled by release/dev-automation.json.'
              exit 1
            }
            if test -f release/product_versions.py; then
              identity=$(python3 release/product_versions.py "$SOURCE" android-assistant)
            else
              identity=$(python3 release/biscuit_dev.py "$SOURCE")
            fi
            read -r core revision display <<< "$identity"
            if [[ -n "$display" && "$display" != "$core" ]]; then VERSION=$display; fi
            publish=true
          elif [[ "$SIGN_ONLY" == true ]]; then
            test "$MANUAL_ALLOWED" = true
            read -r core revision VERSION <<< "$(python3 release/product_versions.py "$SOURCE" android-assistant)"
          fi
          if [[ "$publish" == true || "$SIGN_ONLY" == true ]]; then
            git rev-list --first-parent origin/main | grep -Fx "$SOURCE" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE" --jq '.commit.verification.verified' | grep -Fx true
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev\.[1-9][0-9]*)?$ ]]
          [[ "$revision" =~ ^[1-9][0-9]*$ && "$revision" -le 2100000000 ]]
          printf 'publish=%s\nversion=%s\nrevision=%s\n' "$publish" "$VERSION" "$revision" >> "$GITHUB_OUTPUT"
          printf 'ENCORE_VERSION_NAME=%s\nENCORE_VERSION_CODE=%s\n' "$VERSION" "$revision" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        with:
          go-version: '1.27.4'
          cache: false
      - name: Use Java 21
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        with:
          packages: platform-tools
      - name: Install pinned Android and Gradle tools
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-9.4.1/bin/gradle" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Cache Gradle modules and Robolectric SDKs
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-2.*
            ~/.m2/repository/org/robolectric/android-all-instrumented
          key: android-assistant-maven-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devices/android-assistant/**/*.gradle.kts', 'devices/android-assistant/gradle.properties', 'devices/android-assistant/build-android') }}
          # Borrow downloaded dependencies, not task outputs. Save under this app's own key.
          restore-keys: |
            android-assistant-maven-v1-${{ runner.os }}-${{ runner.arch }}-
            android-maven-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare the pinned Robolectric test SDK
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # MicActivityTest runs on API 35 with Robolectric 4.16 (instrumentation i7).
          version=15-robolectric-13954326-i7
          path="org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
          jar="$HOME/.m2/repository/$path"
          sha=5fc64ffccf4788154162686b3966ddd63abea8326542c465e2a7f0129fc92770d0e1e8ddcfabd7f1500e491ec02e3b4104b9e51b61fccd9cf08006c9dc02987c
          if [[ ! -f "$jar" ]] || ! printf '%s  %s\n' "$sha" "$jar" | sha512sum --check --status; then
            mkdir -p "$(dirname "$jar")"
            trap 'rm -f "$jar.part"' EXIT
            curl -fsSL --retry 3 --connect-timeout 15 "https://repo.maven.apache.org/maven2/$path" -o "$jar.part" ||
              curl -fsSL --retry 3 --connect-timeout 15 "https://maven-central.storage-download.googleapis.com/maven2/$path" -o "$jar.part"
            printf '%s  %s\n' "$sha" "$jar.part" | sha512sum --check
            mv "$jar.part" "$jar"
          fi
      - name: Build and check the assistant
        if: github.event_name != 'workflow_run' || steps.release.outputs.publish == 'true'
        run: |
          go test ./devices/android-assistant/mobile
          devices/android-assistant/build-android assembleDebug testDebugUnitTest lintDebug assembleRelease
      - name: Stage unsigned release and matching source
        if: steps.release.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/assistant-unsigned"
          mkdir "$dir"
          cp devices/android-assistant/build/outputs/apk/release/EncoreSatelliteAssistant-release-unsigned.apk "$dir/unsigned.apk"
          git archive --format=tar.gz --prefix=encore-satellite/ -o "$dir/encore-assistant-source.tar.gz" HEAD
          python3 release/android_dev.py --assistant-sources "$dir/encore-assistant-dependencies-source.tar.gz"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            jq -er '.target_changelogs["android-assistant"] | select(type == "string" and length > 0)' \
              "$RUNNER_TEMP/dev-release-plan/plan.json" > "$dir/release-notes.md"
          elif [[ "$PUBLISH" == true ]]; then
            python3 release/dev_plan.py --assistant-notes "$SOURCE" "$dir/release-notes.md"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: android-assistant-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assistant-unsigned
          if-no-files-found: error

  sign:
    needs: build
    if: >-
      (needs.build.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.sign_only)) &&
      github.repository == 'farooqu/encore-satellite' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: ${{ github.event_name == 'workflow_run' && 'android-dev-signing' || 'android-signing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-assistant-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assistant-release
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned APK signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Verify identity and sign with the shared Android key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
          VERSION: ${{ needs.build.outputs.version }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          set -euo pipefail
          umask 077
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          cd "$RUNNER_TEMP/assistant-release"
          [[ "$EXPECTED_CERTIFICATE" =~ ^[0-9a-f]{64}$ ]]
          badging=$(aapt dump badging unsigned.apk)
          grep -F "package: name='com.encore.personal' versionCode='$REVISION' versionName='$VERSION'" <<< "$badging"
          grep -Fx "native-code: 'arm64-v8a' 'armeabi-v7a'" <<< "$badging"
          key=$(mktemp "$RUNNER_TEMP/assistant-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          : "${KEYSTORE_BASE64:?Missing Android release keystore}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          unset KEYSTORE_BASE64
          zipalign -c -P 16 4 unsigned.apk
          apksigner sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --v4-signing-enabled false --out encore-satellite-assistant.apk unsigned.apk
          apk=encore-satellite-assistant.apk
          certificate=$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$certificate" = "$EXPECTED_CERTIFICATE"
          zipalign -c -P 16 4 "$apk"
          rm unsigned.apk
          sha256sum "$apk" ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-assistant-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assistant-release
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: needs.build.outputs.publish == 'true'
    concurrency:
      group: release-publication
      queue: max
    environment: ${{ github.event_name == 'workflow_run' && 'release-dev-publication' || 'release-publication' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-assistant-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assistant-release
      - name: Retain the exact signed APK and source as a prerelease
        env:
          SETUP_APPROVED: ${{ vars.RELEASE_SETUP_APPROVED }}
          IMMUTABILITY_READ_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.IMMUTABILITY_READ_TOKEN || '' }}
        run: |
          set -euo pipefail
          test "$SETUP_APPROVED" = true
          target_args=(--target "$SOURCE")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            : "${IMMUTABILITY_READ_TOKEN:?Missing immutable releases settings read token}"
            GH_TOKEN="$IMMUTABILITY_READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled | grep -Fx true
          fi
          tag="android-assistant-r$REVISION"
          title="Encore Satellite Assistant Dev $VERSION (r$REVISION)"
          if [[ "$VERSION" == *-dev.* ]]; then
            tag="android-assistant-v$VERSION"
            title="Encore Satellite Assistant $VERSION"
          fi
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/android-assistant-")
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          # A newer revision may have finished first. Never publish a downgrade.
          jq -e --argjson revision "$REVISION" \
            'all(.[].ref | select(test("^refs/tags/android-assistant-r[0-9]+$")); (split("-r")[-1] | tonumber) <= $revision)' <<< "$refs"
          jq -e --arg version "$VERSION" '
            def key: sub("-dev\\."; ".") | split(".") | map(tonumber);
            all(.[].ref | select(test("^refs/tags/android-assistant-v[0-9.]+-dev\\.[0-9]+$"));
                ($version | contains("-dev.")) and ((split("-v")[-1] | key) <= ($version | key)))' <<< "$refs"
          jq -e --arg tag "$tag" 'all(.[][]; .tag_name != $tag)' <<< "$releases"
          if jq -e --arg tag "refs/tags/$tag" 'any(.[]; .ref == $tag)' <<< "$refs" >/dev/null; then
            # Like regular Android Dev, accept only an exact maintainer-created fallback tag.
            test "$GITHUB_EVENT_NAME" = workflow_run
            jq -e --arg tag "refs/tags/$tag" --arg source "$SOURCE" \
              'any(.[]; .ref == $tag and .object.type == "commit" and .object.sha == $source)' <<< "$refs" >/dev/null
            target_args=(--verify-tag)
          fi
          cd "$RUNNER_TEMP/assistant-release"
          sha256sum -c SHA256SUMS
          notes="$RUNNER_TEMP/release-notes.md"
          mv release-notes.md "$notes"
          printf '\nExperimental Dev sideload APK. [Installation guide](https://github.com/%s/blob/%s/devices/android-assistant/README.md). No update feed is activated.\n' \
            "$GITHUB_REPOSITORY" "$SOURCE" >> "$notes"
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" "${target_args[@]}" \
            --draft --prerelease --title "$title" \
            --notes-file "$notes"
          mkdir "$RUNNER_TEMP/assistant-retained"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assistant-retained"
          diff -qr . "$RUNNER_TEMP/assistant-retained"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .immutable | grep -Fx true
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha | grep -Fx "$SOURCE"
